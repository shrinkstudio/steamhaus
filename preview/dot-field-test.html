<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Steamhaus — Dot Field test</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #00160e; font-family: ui-sans-serif, system-ui, sans-serif; }
  .section {
    position: relative;
    min-height: 100vh;
    background: #00160e;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .section__content {
    position: relative; z-index: 1;
    text-align: center; color: #e6e8e7; max-width: 40rem; padding: 2rem;
  }
  .eyebrow { font-family: ui-monospace, monospace; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: #e7a38b; margin-bottom: 1rem; }
  h2 { font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; margin: 0 0 1rem; }
  p { color: rgba(255,255,255,0.65); line-height: 1.55; font-size: 1.1rem; }
</style>
</head>
<body>

<section class="section"
  data-dot-field
  data-dot-radius="1.6"
  data-dot-spacing="16"
  data-bulge-strength="70"
  data-cursor-radius="480"
  data-glow-radius="180"
  data-glow-color="#334941"
  data-gradient-from="rgba(153,164,160,0.34)"
  data-gradient-to="rgba(102,118,113,0.16)">
  <div class="section__content">
    <div class="eyebrow">Interactive background</div>
    <h2>Move your cursor across the field.</h2>
    <p>The dot grid bulges away from the pointer, with a soft glow that intensifies with speed. Brand-toned dots on #00160E.</p>
  </div>
</section>

<script>
// ── inlined vanilla dot-field (mirrors src/scripts/dot-field.js) ──
const TWO_PI = Math.PI * 2;
function num(el, a, f){const v=parseFloat(el.getAttribute(a));return isNaN(v)?f:v;}
function str(el, a, f){const v=el.getAttribute(a);return v==null||v===''?f:v;}
function bool(el, a, f){const v=el.getAttribute(a);if(v==null)return f;return v==='true'||v===''||v==='1';}

function initInstance(container) {
  const opts = {
    dotRadius: num(container,'data-dot-radius',1.5),
    dotSpacing: num(container,'data-dot-spacing',14),
    cursorRadius: num(container,'data-cursor-radius',500),
    bulgeStrength: num(container,'data-bulge-strength',67),
    glowRadius: num(container,'data-glow-radius',160),
    glowColor: str(container,'data-glow-color','#002f1e'),
    gradientFrom: str(container,'data-gradient-from','rgba(153,164,160,0.30)'),
    gradientTo: str(container,'data-gradient-to','rgba(102,118,113,0.18)'),
    sparkle: bool(container,'data-sparkle',false),
    waveAmplitude: num(container,'data-wave-amplitude',0),
  };
  if (getComputedStyle(container).position === 'static') container.style.position='relative';
  const canvas = document.createElement('canvas');
  canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;';
  container.prepend(canvas);
  const ctx = canvas.getContext('2d',{alpha:true});
  const dpr = Math.min(window.devicePixelRatio||1,2);
  let dots=[], size={w:0,h:0}, rect={left:0,top:0};
  const mouse={x:-9999,y:-9999,prevX:-9999,prevY:-9999,speed:0};
  let engagement=0, glowOpacity=0, raf=null, frame=0;

  function buildDots(w,h){
    const step=opts.dotRadius+opts.dotSpacing;
    const cols=Math.floor(w/step), rows=Math.floor(h/step);
    const padX=(w%step)/2, padY=(h%step)/2;
    const arr=new Array(rows*cols); let i=0;
    for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
      const ax=padX+col*step+step/2, ay=padY+row*step+step/2;
      arr[i++]={ax,ay,sx:ax,sy:ay};
    }
    dots=arr;
  }
  function measure(){
    const r=container.getBoundingClientRect();
    rect={left:r.left,top:r.top};
    if(r.width===0||r.height===0)return;
    canvas.width=r.width*dpr; canvas.height=r.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    size={w:r.width,h:r.height};
    buildDots(r.width,r.height);
  }
  function onMove(e){mouse.x=e.clientX-rect.left;mouse.y=e.clientY-rect.top;}
  function refreshRect(){const r=container.getBoundingClientRect();rect={left:r.left,top:r.top};}
  const speedTimer=setInterval(()=>{
    const dx=mouse.prevX-mouse.x,dy=mouse.prevY-mouse.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    mouse.speed+=(dist-mouse.speed)*0.5;
    if(mouse.speed<0.001)mouse.speed=0;
    mouse.prevX=mouse.x;mouse.prevY=mouse.y;
  },20);
  function tick(){
    frame++; const {w,h}=size; const t=frame*0.02;
    const target=Math.min(mouse.speed/5,1);
    engagement+=(target-engagement)*0.06; if(engagement<0.001)engagement=0;
    glowOpacity+=(engagement-glowOpacity)*0.08;
    ctx.clearRect(0,0,w,h);
    const grad=ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,opts.gradientFrom); grad.addColorStop(1,opts.gradientTo);
    ctx.fillStyle=grad;
    const cr=opts.cursorRadius, crSq=cr*cr, rad=opts.dotRadius/2;
    ctx.beginPath();
    for(let i=0;i<dots.length;i++){
      const d=dots[i], dx=mouse.x-d.ax, dy=mouse.y-d.ay, distSq=dx*dx+dy*dy;
      if(distSq<crSq&&engagement>0.01){
        const dist=Math.sqrt(distSq), k=1-dist/cr, push=k*k*opts.bulgeStrength*engagement, angle=Math.atan2(dy,dx);
        d.sx+=(d.ax-Math.cos(angle)*push-d.sx)*0.15;
        d.sy+=(d.ay-Math.sin(angle)*push-d.sy)*0.15;
      } else { d.sx+=(d.ax-d.sx)*0.1; d.sy+=(d.ay-d.sy)*0.1; }
      let drawX=d.sx, drawY=d.sy;
      if(opts.waveAmplitude>0){drawY+=Math.sin(d.ax*0.03+t)*opts.waveAmplitude;drawX+=Math.cos(d.ay*0.03+t*0.7)*opts.waveAmplitude*0.5;}
      ctx.moveTo(drawX+rad,drawY); ctx.arc(drawX,drawY,rad,0,TWO_PI);
    }
    ctx.fill();
    if(glowOpacity>0.01&&mouse.x>-9000){
      const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,opts.glowRadius);
      g.addColorStop(0,opts.glowColor); g.addColorStop(1,'transparent');
      ctx.globalAlpha=glowOpacity; ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(mouse.x,mouse.y,opts.glowRadius,0,TWO_PI); ctx.fill();
      ctx.globalAlpha=1;
    }
    raf=requestAnimationFrame(tick);
  }
  const ro=new ResizeObserver(measure); ro.observe(container);
  window.addEventListener('mousemove',onMove,{passive:true});
  window.addEventListener('scroll',refreshRect,{passive:true});
  measure(); raf=requestAnimationFrame(tick);
  window.__dotTick = tick; window.__dotMouse = mouse; window.__dotEng = () => engagement;
}
document.querySelectorAll('[data-dot-field]').forEach(initInstance);
</script>
</body>
</html>
