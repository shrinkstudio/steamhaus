        console.warn("list-load:", err);
        return false;
      }).then(function(result) {
        isLoading = false;
        listEl.classList.remove(loadingClass);
        if (buttonEl) {
          buttonEl.classList.remove(loadingClass);
          buttonEl.removeAttribute("aria-busy");
          var spinner = buttonEl.querySelector("[data-list-spinner]");
          if (spinner) spinner.remove();
        }
        return result;
      });
    }
    function loadAllPages() {
      return loadNextPage().then(function(hadItems) {
        if (hadItems && nextUrl && !destroyed) return loadAllPages();
      });
    }
    if (mode === "all") {
      loadAllPages();
    }
    if (mode === "more") {
      var buttonScope = instance ? scope : listEl.closest("section, .section") || scope;
      buttonEl = findEl(buttonScope, "button", instance);
      if (buttonEl) {
        if (!nextUrl) buttonEl.style.display = "none";
        buttonHandler = function(e) {
          e.preventDefault();
          e.stopPropagation();
          loadNextPage().then(function() {
            if (!nextUrl && buttonEl) buttonEl.style.display = "none";
          });
        };
        buttonEl.addEventListener("click", buttonHandler);
      }
    }
    if (mode === "infinite") {
      var loaderEl = findEl(scope, "loader", instance);
      var sentinel = loaderEl;
      if (!sentinel) {
        sentinel = document.createElement("div");
        sentinel.setAttribute("data-list-sentinel", "");
        sentinel.style.height = "1px";
        listEl.appendChild(sentinel);
      }
      if (!nextUrl && loaderEl) loaderEl.style.display = "none";
      observer = new IntersectionObserver(
        function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting && nextUrl && !isLoading) {
              loadNextPage().then(function() {
                if (!nextUrl) {
                  if (loaderEl) loaderEl.style.display = "none";
                  if (observer) observer.disconnect();
                }
              });
            }
          });
        },
        { rootMargin: "0px 0px 200px 0px" }
      );
      observer.observe(sentinel);
    }
    updateCount();
    return function destroy() {
      destroyed = true;
      if (observer) observer.disconnect();
      if (buttonEl && buttonHandler) buttonEl.removeEventListener("click", buttonHandler);
      var sentinel2 = listEl.querySelector("[data-list-sentinel]");
      if (sentinel2) sentinel2.remove();
    };
  }
  function initListLoad(scope) {
    scope = scope || document;
    var lists = scope.querySelectorAll("[data-list-load]");
    if (!lists.length) return;
    injectSpinnerStyles();
    lists.forEach(function(listEl, index) {
      var cleanup = initInstance(listEl, scope, index);
      if (cleanup) cleanups2.push(cleanup);
    });
  }

  gsap.registerPlugin(CustomEase);
  CustomEase.create("steamhaus", "0.625, 0.05, 0, 1");
  CustomEase.create("parallax", "0.7, 0.05, 0.13, 1");
  gsap.defaults({ ease: "steamhaus", duration: 0.6 });
  var hasScrollTrigger = typeof window.ScrollTrigger !== "undefined";
  if (typeof window.Lenis !== "undefined") {
    const lenis = new Lenis({ lerp: 0.165, wheelMultiplier: 1.25 });
    window.__steamhausLenis = lenis;
    if (hasScrollTrigger) lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1e3));
    gsap.ticker.lagSmoothing(0);
  }
  function run() {
    if (document.querySelector("[data-menu-wrap]")) {
      initNavDropdown();
      initNavScrollHide();
    }
    if (document.querySelector("[data-reveal-group]")) initContentReveal(document);
    if (document.querySelector('[data-slider="slider"]')) initSliders(document);
    if (document.querySelector("[data-list-load]")) initListLoad(document);
    if (hasScrollTrigger) requestAnimationFrame(() => ScrollTrigger.refresh());
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
